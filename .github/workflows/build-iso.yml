name: Build LunnaOS Polaris ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "iso.toml"
      - ".github/workflows/build-iso.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build UEFI installer ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Build ISO
        id: build
        uses: ublue-os/bootc-image-builder-action@main
        with:
          bootc-image-builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          use-librepo: true
          config-file: ./iso.toml
          image: ghcr.io/wellingtomgarcez8-sudo/lunnaospollaris:latest

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunnaospollaris-uefi-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          compression-level: 0
