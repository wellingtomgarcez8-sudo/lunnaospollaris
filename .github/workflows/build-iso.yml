name: Build LunnaOS Polaris ISO

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build LunnaOS Polaris"]
    types: [completed]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build UEFI installer ISO
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v9
        with:
          remove-codeql: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ISO
        id: build
        uses: ublue-os/bootc-image-builder-action@main
        with:
          bootc-image-builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          use-librepo: true
          config-file: ./iso.toml
          image: ghcr.io/wellingtomgarcez8-sudo/lunnaospollaris:latest

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lunnaospollaris-uefi-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          compression-level: 0
