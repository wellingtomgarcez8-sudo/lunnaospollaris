name: LunnaOS Linux build
on:
  push:
    branches: [lunnaos-linux-gnome, main]
  workflow_dispatch:
jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86
      - name: Build LunnaOS image
        run: |
          podman build -t lunnaos-builder .
          podman run --rm --privileged -v "$PWD:/workspace" lunnaos-builder
      - name: Show artifacts
        run: find . -maxdepth 4 -type f \( -name '*.wic' -o -name '*.iso' -o -name '*.tar' \) -print
