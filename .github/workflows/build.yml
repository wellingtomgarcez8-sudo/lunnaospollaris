name: Build LunnaOS Polaris
# Optimized CI image build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'kas/**'
      - 'meta-lunnaos/**'
      - 'config/**'
      - 'scripts/**'
      - 'Containerfile'

# A newer build replaces an older one. This prevents wasting runner time
# when several commits arrive while Yocto is compiling.
concurrency:
  group: lunnaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Validate repository
        run: |
          chmod +x scripts/*.sh
          ./scripts/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Yocto downloads and sstate are content-addressed. A stable cache key
      # lets new commits reuse everything that is still valid instead of
      # invalidating the whole cache whenever a recipe changes.
      - name: Restore Yocto downloads and sstate
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-${{ runner.os }}-scarthgap-genericx86-64
          restore-keys: |
            yocto-${{ runner.os }}-scarthgap-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build builder image
        run: podman build --layers -t lunnaos-builder .

      - name: Build LunnaOS
        env:
          BB_NUMBER_THREADS: 4
          PARALLEL_MAKE: -j4
          BB_FETCH_PREMIRRORONLY: "0"
        run: |
          mkdir -p build output
          podman run --rm --privileged --userns=keep-id \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/lunnaos-home \
            -e BB_NUMBER_THREADS="$BB_NUMBER_THREADS" \
            -e PARALLEL_MAKE="$PARALLEL_MAKE" \
            -e BB_FETCH_PREMIRRORONLY="$BB_FETCH_PREMIRRORONLY" \
            -v "$PWD:/workspace" \
            lunnaos-builder

      - name: Build RPM package index
        run: |
          podman run --rm --privileged --userns=keep-id \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/lunnaos-home \
            -v "$PWD:/workspace" \
            lunnaos-builder \
            kas shell /workspace/kas/lunnaos.yml -c "bitbake package-index"

      - name: Validate generated image
        run: |
          test -n "$(find build/tmp/deploy/images/genericx86-64 -maxdepth 1 -type f -name '*.wic' -print -quit)"
          find build/tmp/deploy/images/genericx86-64 -maxdepth 1 -type f \
            \( -name '*.wic' -o -name '*.manifest' \) -print

      - name: Upload LunnaOS image
        uses: actions/upload-artifact@v4
        with:
          name: LunnaOS-Polaris-x86_64
          path: |
            build/tmp/deploy/images/genericx86-64/*.wic
            build/tmp/deploy/images/genericx86-64/*.manifest
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload RPM feed
        uses: actions/upload-artifact@v4
        with:
          name: LunnaOS-RPM-Feed
          path: build/tmp/deploy/rpm/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

  publish-rpm-feed:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rpm-repo
          fetch-depth: 1

      - name: Download RPM feed
        uses: actions/download-artifact@v4
        with:
          name: LunnaOS-RPM-Feed
          path: rpm

      - name: Publish RPM repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpm
          git commit -m "repo: update LunnaOS RPM feed" || exit 0
          git push origin HEAD:rpm-repo
