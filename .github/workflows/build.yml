name: LunnaOS Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lunnaos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86

      - name: Build LunnaOS
        run: |
          podman build -t lunnaos-builder .
          podman run --rm --privileged \
            -v "$PWD:/workspace" \
            -v "$HOME/.cache/lunnaos:/workspace/build/downloads" \
            lunnaos-builder

      - name: Locate image
        run: |
          find build -type f \( -name '*.wic' -o -name '*.iso' -o -name '*.rootfs.*' \) -print

      - name: Upload LunnaOS image
        uses: actions/upload-artifact@v4
        with:
          name: LunnaOS-Polaris-x86_64
          path: |
            build/tmp/deploy/images/genericx86-64/*.wic
            build/tmp/deploy/images/genericx86-64/*.manifest
          if-no-files-found: error
          retention-days: 14
