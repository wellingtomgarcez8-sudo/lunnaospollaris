name: Build LunnaOS Polaris

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'kas/**'
      - 'meta-lunnaos/**'
      - 'config/**'
      - 'scripts/**'
      - 'Containerfile'

concurrency:
  group: lunnaos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        run: |
          chmod +x scripts/*.sh
          ./scripts/validate.sh

  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore Yocto build cache
        uses: actions/cache@v4
        with:
          path: |
            build/downloads
            build/sstate-cache
          key: yocto-${{ runner.os }}-${{ hashFiles('kas/**', 'meta-lunnaos/**', 'Containerfile') }}
          restore-keys: |
            yocto-${{ runner.os }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman qemu-system-x86

      - name: Build builder image
        run: podman build -t lunnaos-builder .

      - name: Build LunnaOS
        env:
          BB_NUMBER_THREADS: 4
          PARALLEL_MAKE: -j4
        run: |
          mkdir -p build output
          podman run --rm --privileged --userns=keep-id             --user "$(id -u):$(id -g)"             -e HOME=/tmp/lunnaos-home             -e BB_NUMBER_THREADS="$BB_NUMBER_THREADS"             -e PARALLEL_MAKE="$PARALLEL_MAKE"             -v "$PWD:/workspace"             lunnaos-builder

      - name: Validate generated image
        run: |
          test -n "$(find build/tmp/deploy/images/genericx86-64 -maxdepth 1 -type f -name '*.wic' -print -quit)"
          find build/tmp/deploy/images/genericx86-64 -maxdepth 1 -type f \( -name '*.wic' -o -name '*.manifest' \) -print

      - name: Upload LunnaOS image
        uses: actions/upload-artifact@v4
        with:
          name: LunnaOS-Polaris-x86_64
          path: |
            build/tmp/deploy/images/genericx86-64/*.wic
            build/tmp/deploy/images/genericx86-64/*.manifest
          if-no-files-found: error
          retention-days: 14
